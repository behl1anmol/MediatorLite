name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.cursor/skills/**'
      - '.github/copilot-instructions.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.cursor/skills/**'
      - '.github/copilot-instructions.md'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Verify CI solution filter covers every project
      shell: bash
      run: |
        python3 - <<'PY'
        import json, subprocess, sys
        sln = [l.strip().replace("\\", "/")
               for l in subprocess.run(["dotnet", "sln", "MediatorLite.sln", "list"],
                                       capture_output=True, text=True, check=True).stdout.splitlines()
               if l.strip().endswith(".csproj")]
        flt = {p.replace("\\", "/")
               for p in json.load(open("MediatorLite.CI.slnf"))["solution"]["projects"]}
        # The competitive benchmark harness is intentionally excluded from CI.
        intentional = "tests/CompetitiveBenchmarks/"
        missing = [p for p in sln if p not in flt and intentional not in p]
        stale = [p for p in flt if p not in sln]
        for p in missing:
            print(f"::error::{p} is in MediatorLite.sln but not in MediatorLite.CI.slnf - it would silently skip CI")
        for p in stale:
            print(f"::error::{p} is in MediatorLite.CI.slnf but no longer in MediatorLite.sln")
        if missing or stale:
            sys.exit(1)
        print(f"OK: {len(flt)} projects built by CI, {len(sln) - len(flt)} intentionally excluded")
        PY

    - name: Restore dependencies
      run: dotnet restore MediatorLite.CI.slnf

    - name: Build
      run: dotnet build MediatorLite.CI.slnf --configuration Release --no-restore

    - name: Run tests
      run: dotnet test MediatorLite.CI.slnf --configuration Release --no-build --verbosity normal --logger trx --logger "junit;LogFilePath=TestResults/junit-results.xml" --collect:"XPlat Code Coverage"

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Upload coverage reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-reports
        path: '**/TestResults/*/coverage.cobertura.xml'

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        files: '**/TestResults/*/coverage.cobertura.xml'
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        report_type: test_results
        files: '**/TestResults/junit-results.xml'
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore MediatorLite.CI.slnf

    - name: Check code formatting (whitespace)
      run: dotnet format whitespace --verify-no-changes --verbosity diagnostic --no-restore MediatorLite.CI.slnf

    - name: Check code formatting (style)
      run: dotnet format style --verify-no-changes --verbosity diagnostic --no-restore MediatorLite.CI.slnf

    - name: Build and run analyzers
      run: dotnet build MediatorLite.CI.slnf --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true

