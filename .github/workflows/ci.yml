name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.cursor/skills/**'
      - '.github/copilot-instructions.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '.claude/skills/**'
      - '.agents/skills/**'
      - '.cursor/skills/**'
      - '.github/copilot-instructions.md'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --logger "junit;LogFilePath=TestResults/junit-results.xml" --collect:"XPlat Code Coverage"

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    - name: Upload coverage reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-reports
        path: '**/TestResults/*/coverage.cobertura.xml'

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        files: '**/TestResults/*/coverage.cobertura.xml'
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        report_type: test_results
        files: '**/TestResults/junit-results.xml'
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Check code formatting (whitespace)
      run: dotnet format whitespace --verify-no-changes --verbosity diagnostic --no-restore

    - name: Check code formatting (style)
      run: dotnet format style --verify-no-changes --verbosity diagnostic --no-restore

    - name: Build and run analyzers
      run: dotnet build --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true

  competitive-benchmarks:
    name: Competitive Benchmarks (build only)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Builds tests/CompetitiveBenchmarks so that a refactor in src/ cannot silently
    # break the harness. The benchmarks themselves are NOT run here: they take tens of
    # minutes and shared CI runners are far too noisy to produce numbers worth keeping.
    # Run them locally and record results under tests/CompetitiveBenchmarks/results/.
    - name: Build competitive benchmark harness
      run: |
        for project in SmallProject LargeProject DefaultDiagnostics GeneratorThroughput; do
          dotnet build "tests/CompetitiveBenchmarks/$project" --configuration Release
        done
