name: Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/MediatorLite.Benchmarks/**'
      - 'tests/MediatorLite.RestApiBenchmarks/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/MediatorLite.Benchmarks/**'
      - 'tests/MediatorLite.RestApiBenchmarks/**'
  workflow_dispatch:  # Allow manual trigger

# Required permissions for commenting on PRs and pushing benchmark data
permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Run Microbenchmarks
      run: |
        cd tests/MediatorLite.Benchmarks
        dotnet run --configuration Release --no-build -- --filter='*' --exporters json markdown --memory

    - name: Run REST API Benchmarks
      run: |
        cd tests/MediatorLite.RestApiBenchmarks
        dotnet run --configuration Release --no-build -- --filter='*' --exporters json markdown --memory

    - name: Upload benchmark results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: benchmark-results
        path: |
          tests/MediatorLite.Benchmarks/BenchmarkDotNet.Artifacts/results/*.json
          tests/MediatorLite.Benchmarks/BenchmarkDotNet.Artifacts/results/*.md
          tests/MediatorLite.RestApiBenchmarks/BenchmarkDotNet.Artifacts/results/*.json
          tests/MediatorLite.RestApiBenchmarks/BenchmarkDotNet.Artifacts/results/*.md

    - name: Combine benchmark results
      if: github.event_name != 'pull_request'
      continue-on-error: true
      run: |
        results_dir="tests/MediatorLite.Benchmarks/BenchmarkDotNet.Artifacts/results"
        if [ ! -d "$results_dir" ]; then
          echo "Benchmark results directory not found"
          exit 1
        fi

        cd "$results_dir"
        echo "Files in results directory:"
        ls -la

        # Find all JSON files (excluding any we might create)
        json_files=($(find . -maxdepth 1 -name "*.json" -type f ! -name "combined-benchmarks.json"))

        if [ ${#json_files[@]} -eq 0 ]; then
          echo "WARNING: No JSON files found. JSON exporter may not be working."
          echo "Benchmark history tracking will be skipped."
          echo "Available files:"
          ls -la
          exit 0
        fi

        echo "Found ${#json_files[@]} JSON file(s):"
        printf '%s\n' "${json_files[@]}"

        # Combine all JSON files into one
        echo "Combining JSON files..."
        jq -s 'add' "${json_files[@]}" > combined-benchmarks.json

        echo "Combined benchmark file created successfully:"
        ls -lh combined-benchmarks.json

    - name: Store benchmark result
      if: github.event_name != 'pull_request'
      continue-on-error: true
      run: |
        if [ -f "tests/MediatorLite.Benchmarks/BenchmarkDotNet.Artifacts/results/combined-benchmarks.json" ]; then
          echo "Benchmark history tracking is available via benchmark-action"
          # Note: The benchmark-action step would go here if JSON files are successfully generated
        else
          echo "Skipping benchmark history tracking - no JSON file available"
        fi

    - name: Update docs/benchmarks.md
      if: github.event_name != 'pull_request'
      continue-on-error: true
      run: python3 .github/scripts/update-benchmarks-doc.py

    - name: Commit benchmark docs
      if: github.event_name != 'pull_request'
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/benchmarks.md
        git diff --staged --quiet || git commit -m "docs: update benchmark results [skip ci]"
        git push

    - name: Comment PR with benchmark results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const resultDirs = [
            './tests/MediatorLite.Benchmarks/BenchmarkDotNet.Artifacts/results',
            './tests/MediatorLite.RestApiBenchmarks/BenchmarkDotNet.Artifacts/results'
          ];

          try {
            let combinedResults = '## Benchmark Results\n\n';

            for (const path of resultDirs) {
              if (!fs.existsSync(path)) {
                console.log(`Benchmark results directory not found: ${path}`);
                continue;
              }

              const files = fs.readdirSync(path);
              console.log(`Files found in ${path}:`, files);

              let mdFiles = files.filter(f => f.endsWith('-report-github.md'));
              if (mdFiles.length === 0) {
                mdFiles = files.filter(f => f.endsWith('.md'));
              }

              if (mdFiles.length === 0) {
                continue;
              }

              combinedResults += `### ${path.includes('RestApi') ? 'REST API Benchmarks' : 'Microbenchmarks'}\n\n`;

              for (const mdFile of mdFiles) {
                const content = fs.readFileSync(`${path}/${mdFile}`, 'utf8');
                let benchmarkName = mdFile
                  .replace('-report-github.md', '')
                  .replace('-report.md', '')
                  .replace('.md', '');
                combinedResults += `#### ${benchmarkName}\n\n${content}\n\n---\n\n`;
              }
            }

            if (combinedResults.trim() === '## Benchmark Results') {
              console.log('No benchmark markdown files found in either directory');
              return;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: combinedResults
            });
          } catch (error) {
            console.log('Error reading benchmark results:', error.message);
          }
