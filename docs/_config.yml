title: MediatorLite
description: Lightweight, high-performance mediator for .NET with zero-reflection dispatch and compile-time source generation.
url: https://behl1anmol.github.io
baseurl: /MediatorLite

remote_theme: just-the-docs/just-the-docs

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true

# Footer
footer_content: >
  Copyright &copy; 2024 <a href="https://github.com/behl1anmol">behl1anmol</a>.
  Distributed under the <a href="https://opensource.org/licenses/MIT">MIT License.</a>

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Last edit timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Color scheme (light | dark)
color_scheme: light

# Aux links in top-right
aux_links:
  "GitHub":
    - "https://github.com/behl1anmol/MediatorLite"
  "NuGet":
    - "https://www.nuget.org/packages/MediatorLite/"

aux_links_new_tab: true

# Heading anchor links
heading_anchors: true

# External navigation links
nav_external_links:
  - title: MediatorLite on NuGet
    url: https://www.nuget.org/packages/MediatorLite/
    hide_icon: false
  - title: MediatorLite.SourceGeneration on NuGet
    url: https://www.nuget.org/packages/MediatorLite.SourceGeneration/
    hide_icon: false

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
